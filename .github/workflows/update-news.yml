
name: Update News and Deploy Website

on:
  schedule:
    - cron: '17 * * * *'

  workflow_dispatch:

  push:
    branches:
      - master

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install beautifulsoup4

      - name: Fetch Telegram news
        run: |
          if ! python .github/scripts/update_news.py; then
            echo "::warning::Telegram unavailable. Using cached news."

            if [ ! -s news.json ]; then
              printf '{"items":[]}\n' > news.json
            fi
          fi

      - name: Save updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Telegram news"
            git push origin master
          else
            echo "No news changes."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build website
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
