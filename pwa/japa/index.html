<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Japa Counter</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/site.webmanifest">

  <!-- Favicon для браузеров -->
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />

  <!-- Apple iOS -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Japa" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Цвет темы браузера / Android -->
  <meta name="theme-color" content="#2b2b2b">

  <!-- Стили -->
  <link rel="stylesheet" href="./style.css">
</head>


<body>

  <header>
    <h1>Japa<br>Counter</h1>
  </header>

  <main>

    <section class="card">
      <label>
        Кругов:
        <select id="rounds">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="4">4</option>
          <option value="8">8</option>
          <option value="16">16</option>
        </select>
      </label>

      <p>Текущий круг: <strong id="current-round">1</strong></p>
      <p>Мантра: <strong id="current-count">0</strong> / 108</p>
    </section>

    <section class="card">
      <button id="plus">+1 мантра</button>
      <button id="reset">Сброс</button>
    </section>

  </main>

  <footer id="update-footer">
    <!-- Здесь будет появляться ссылка для обновления -->
  </footer>

  <script src="./app.js"></script>

</body>

</html>
